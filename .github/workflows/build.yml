name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac -d build/classes \
            -cp $ANDROID_HOME/platforms/android-34/android.jar \
            MainActivity.java

      - name: Create DEX
        run: |
          d8 --output build/ --lib $ANDROID_HOME/platforms/android-34/android.jar \
            $(find build/classes -name "*.class")

      - name: Package APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          cd build
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt package -f \
            -M ../AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            -F unsigned.apk
          zip -uj unsigned.apk classes.dex
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -f 4 unsigned.apk aligned.apk

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          keytool -genkey -v -keystore build/keystore.jks -alias key -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=Test"
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks build/keystore.jks --ks-pass pass:123456 \
            --out build/calculator.apk build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: build/calculator.apk
