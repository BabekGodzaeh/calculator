name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Resources
        run: |
          mkdir -p build/gen build/classes
          aapt2 compile --dir res -o build/res.zip
          aapt2 link -o build/unsigned.apk \
            -I $ANDROID_HOME/platforms/android-34/android.jar \
            --manifest AndroidManifest.xml \
            build/res.zip \
            --java build/gen

      - name: Compile Java
        run: |
          javac -d build/classes \
            -cp $ANDROID_HOME/platforms/android-34/android.jar \
            MainActivity.java \
            build/gen/**/*.java

      - name: Create DEX
        run: |
          d8 --output build/ --lib $ANDROID_HOME/platforms/android-34/android.jar \
            $(find build/classes -name "*.class")

      - name: Package and Align
        run: |
          cd build
          zip -uj unsigned.apk classes.dex
          zipalign -f 4 unsigned.apk aligned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore build/keystore.jks -alias key -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=Test"
          apksigner sign --ks build/keystore.jks --ks-pass pass:123456 \
            --out build/calculator.apk build/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: build/calculator.apk
